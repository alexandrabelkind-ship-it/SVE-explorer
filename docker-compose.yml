version: "3.8"
services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - AZURE_OPENAI_MONITORING_KEY=${AZURE_OPENAI_MONITORING_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
    volumes:
      - ./data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api